name: linter

on:
  push:
    paths:
      - src/**/*
      - .*.yaml
      - eslint.config.js
      - .github/workflows/linter.yaml
      - package.json
      - package-lock.json
      - vitest.config.ts
  merge_group:
  pull_request:
    paths:
      - src/**/*
      - .*.yaml
      - eslint.config.js
      - .github/workflows/linter.yaml
      - package.json
      - package-lock.json
      - vitest.config.ts
  workflow_dispatch:
  schedule:
    - cron: 0 23 * * * # Every 07:00 CST

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}

permissions:
  contents: read
  actions: write

jobs:
  linter_test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          show-progress: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Installing the dependencies
        uses: AnnAngela/cached_node-modules@v6.0.1
        with:
          command: npm run ci

      - name: Check environment
        run: npx eslint --env-info
      - name: Run eslint
        run: npm run lint:check-ci
      - name: Run tests
        run: npm run test
      - name: Test packaging
        run: npm run package
      - name: Verify build output
        run: |
          node --check ./dist/index.js && echo "dist/index.js is valid JavaScript."
          node --check ./dist/post.js && echo "dist/post.js is valid JavaScript."
      - name: Upload build metafile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: esbuild-metafiles
          path: .cache/*-meta.json
